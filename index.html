<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>꾸며봐요! 과일 공장 타이쿤</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #74b9ff; }
  canvas { width: 100vw; height: 100vh; display: block; }
  #top { position: fixed; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
  .box { background: #fffdf5; border: 2px solid #dcd3b2; border-radius: 15px; padding: 10px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); pointer-events: auto; }
  .stats { display: flex; gap: 8px; }
  .lbl { font-size: 11px; color: #7f8c8d; font-weight: bold; }
  .val { font-size: 16px; color: #27ae60; font-weight: 900; }
  #modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -52%);
    width: 780px; max-width: 92vw; height: 430px; background: #fcfaf2;
    border: 3px solid #dcd3b2; border-radius: 22px; padding: 18px; z-index: 20;
    display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  .tabs { display: flex; gap: 8px; margin: 10px 0; }
  .tab { padding: 7px 15px; border-radius: 18px; border: 2px solid #e2dac3; background: #f4efe1; font-weight: bold; cursor: pointer; }
  .tab.on { background: #4cd137; color: #fff; border-color: #44bd32; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; overflow-y: auto; flex: 1; }
  .card { background: #fff; border: 2px solid #ebe4d0; border-radius: 15px; padding: 12px; text-align: center; cursor: pointer; }
  .card:hover { border-color: #4cd137; transform: translateY(-2px); }
  .card.off { opacity: 0.5; cursor: not-allowed; }
  #dock { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 15; }
  .dbtn { background: #fffdf5; border: 2px solid #dcd3b2; border-radius: 16px; padding: 10px 18px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div class="box"><div class="lbl">🌱 과일 공장 마을</div><div class="val" id="day" style="color:#2c3e50;">1년 차 · 봄 · 1일</div></div>
  <div class="stats">
    <div class="box"><div class="lbl">공장 기금</div><div class="val" id="money">$10</div></div>
    <div class="box"><div class="lbl">초당 수입</div><div class="val" id="inc" style="color:#e67e22;">+$0</div></div>
    <div class="box"><div class="lbl">과일 등급</div><div class="val" id="fruit" style="color:#d35400;">🍋 레몬 (x1)</div></div>
    <div class="box"><div class="lbl">외계인 투자자</div><div class="val" id="inv" style="color:#8e44ad;">0명</div></div>
  </div>
</div>

<div id="modal">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2>🏭 우리 과일 공장 짓기 & 성장</h2>
    <button onclick="document.getElementById('modal').style.display='none'" style="padding:6px 12px; border-radius:10px; border:1px solid #ccc; cursor:pointer;">닫기 ✕</button>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="setCat('farm', this)">🌱 재배·기초</button>
    <button class="tab" onclick="setCat('factory', this)">🏭 가공·공장</button>
    <button class="tab" onclick="setCat('rebirth', this)">👽 환생·진화</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="dock">
  <div class="dbtn" style="background:#ffeaa7;" onclick="harvest()">🍋 직접 수확 (+$2)</div>
  <div class="dbtn" onclick="openModal('farm')">🏗️ 공장 짓기</div>
  <div class="dbtn" onclick="openModal('rebirth')">🚀 환생·진화</div>
  <div class="dbtn" onclick="rot=(rot+1)%4">↻ 섬 돌리기</div>
</div>

<script>
let money = 10, inv = 0, fStage = 0, day = 1, cat = 'farm', rot = 0;
const fruits = [
  { name: '레몬', icon: '🍋', mult: 1, req: 0 },
  { name: '오렌지', icon: '🍊', mult: 42, req: 100 },
  { name: '라임', icon: '🍈', mult: 1764, req: 5000 },
  { name: '자몽', icon: '🍎', mult: 74088, req: 250000 },
  { name: '황금귤', icon: '🍑', mult: 3111696, req: 10000000 }
];
const list = [
  { id: 's1', cat: 'farm', icon: '🏪', name: '레몬 가판대', cost: 10, inc: 3, gx: -2, gy: 1, col: '#f1c40f' },
  { id: 's2', cat: 'farm', icon: '🌳', name: '유기농 과수원', cost: 80, inc: 20, gx: 0, gy: 1, col: '#2ecc71' },
  { id: 's3', cat: 'farm', icon: '🛵', name: '과일 배달센터', cost: 450, inc: 110, gx: 2, gy: 1, col: '#e67e22' },
  { id: 'f1', cat: 'factory', icon: '🧃', name: '자동 착즙공장', cost: 2500, inc: 650, gx: -2, gy: -1, col: '#e74c3c' },
  { id: 'f2', cat: 'factory', icon: '🤖', name: 'AI 스마트팜', cost: 15000, inc: 4200, gx: 0, gy: -1, col: '#3498db' },
  { id: 'f3', cat: 'factory', icon: '🚀', name: '우주 과일기지', cost: 100000, inc: 32000, gx: 2, gy: -1, col: '#9b59b6' }
];
let cnt = { s1:0, s2:0, s3:0, f1:0, f2:0, f3:0 };

function fmt(n) {
  if (n < 1000) return Math.floor(n).toLocaleString();
  const u = ['', 'K', 'M', 'B', 'T', 'Qd'];
  const t = Math.floor(Math.log10(n)/3);
  return (n / Math.pow(10, t*3)).toFixed(2) + (u[t] || 'E');
}
function mult() { return (1 + inv * 0.05) * fruits[fStage].mult; }
function getInc() { return list.reduce((a, b) => a + cnt[b.id] * b.inc, 0) * mult(); }

function harvest() { money += 2 * mult(); ui(); }
function buy(id) {
  const it = list.find(x => x.id === id);
  const c = Math.floor(it.cost * Math.pow(1.25, cnt[id]));
  if (money >= c) { money -= c; cnt[id]++; drawCards(); ui(); }
}
function rebirth() {
  if (money < 5000) return;
  inv += Math.max(1, Math.floor(Math.sqrt(money / 50)));
  money = 10; Object.keys(cnt).forEach(k => cnt[k] = 0);
  drawCards(); ui();
}
function evolve() {
  if (fStage >= fruits.length - 1) return;
  const nx = fruits[fStage + 1];
  if (inv < nx.req) return;
  inv = 0; fStage++; money = 10; Object.keys(cnt).forEach(k => cnt[k] = 0);
  drawCards(); ui();
}

function setCat(c, btn) {
  cat = c;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  drawCards();
}
function openModal(c) {
  document.getElementById('modal').style.display = 'flex';
  cat = c; drawCards();
}
function drawCards() {
  const g = document.getElementById('grid'); g.innerHTML = '';
  if (cat === 'rebirth') {
    const canR = money >= 5000;
    g.innerHTML += `<div class="card ${canR?'':'off'}" onclick="rebirth()"><div style="font-size:32px">👽</div><b>외계인 환생</b><div style="color:#e67e22;font-weight:bold">${canR?'지금 가능!':'필요: $5,000'}</div><small>투자자 1명당 +5% 영구 보너스</small></div>`;
    if (fStage < fruits.length - 1) {
      const nx = fruits[fStage + 1]; const canE = inv >= nx.req;
      g.innerHTML += `<div class="card ${canE?'':'off'}" onclick="evolve()"><div style="font-size:32px">${nx.icon}</div><b>${nx.name} 진화</b><div style="color:#e67e22;font-weight:bold">투자자 ${fmt(nx.req)}명</div><small>모든 생산속도 x42배 폭증!</small></div>`;
    }
    return;
  }
  list.filter(x => x.cat === cat).forEach(it => {
    const c = Math.floor(it.cost * Math.pow(1.25, cnt[it.id]));
    g.innerHTML += `<div class="card ${money>=c?'':'off'}" onclick="buy('${it.id}')">
      <div style="font-size:32px">${it.icon}</div>
      <b>${it.name} (Lv.${cnt[it.id]})</b>
      <div style="color:#e67e22;font-weight:bold">$${fmt(c)}</div>
      <small style="color:#27ae60">초당 +$${fmt(it.inc * mult())}</small>
    </div>`;
  });
}
function ui() {
  document.getElementById('money').innerText = '$' + fmt(money);
  document.getElementById('inc').innerText = '+$' + fmt(getInc()) + '/초';
  const f = fruits[fStage];
  document.getElementById('fruit').innerText = `${f.icon} ${f.name} (x${fmt(f.mult)})`;
  document.getElementById('inv').innerText = fmt(inv) + '명';
}

// 2.5D 섬 그리기
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function iso(gx, gy) {
  let rx = gx, ry = gy;
  if (rot===1){rx=-gy;ry=gx;} else if(rot===2){rx=-gx;ry=-gy;} else if(rot===3){rx=gy;ry=-gx;}
  return { x: cv.width/2 + (rx - ry)*75, y: cv.height/2 + 30 + (rx + ry)*40 };
}
function block(gx, gy, w, h, c1, c2, c3) {
  const p = iso(gx, gy), tw = 60*w, th = 32*w;
  ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(p.x-tw,p.y); ctx.lineTo(p.x,p.y+th); ctx.lineTo(p.x,p.y+th-h); ctx.lineTo(p.x-tw,p.y-h); ctx.fill();
  ctx.fillStyle = c3; ctx.beginPath(); ctx.moveTo(p.x,p.y+th); ctx.lineTo(p.x+tw,p.y); ctx.lineTo(p.x+tw,p.y-h); ctx.lineTo(p.x,p.y+th-h); ctx.fill();
  ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(p.x,p.y-th-h); ctx.lineTo(p.x+tw,p.y-h); ctx.lineTo(p.x,p.y+th-h); ctx.lineTo(p.x-tw,p.y-h); ctx.fill();
  return { x: p.x, y: p.y - h };
}
function loop() {
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  block(0, 0, 3.8, 16, '#ffeaa7', '#fdcb6e', '#e1b12c');
  block(0, 0, 3.4, 20, '#55efc4', '#00b894', '#009432');
  list.forEach(it => {
    if (cnt[it.id] > 0) {
      const top = block(it.gx, it.gy, 0.7, 30 + cnt[it.id]*12, it.col, '#636e72', '#2d3436');
      ctx.font = '28px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(it.icon, top.x, top.y - 6);
    }
  });
  requestAnimationFrame(loop);
}

setInterval(() => { money += getInc() * 0.1; ui(); if(document.getElementById('modal').style.display!=='none') drawCards(); }, 100);
setInterval(() => { day++; document.getElementById('day').innerText = `1년 차 · 봄 · ${day}일`; }, 3000);
drawCards(); ui(); loop();
</script>
</body>
</html>
